services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${TPCDS_MYSQL_PASSWORD:-1234}
      MYSQL_DATABASE: dw_tpcds
      MYSQL_USER: admin
      MYSQL_PASSWORD: ${TPCDS_MYSQL_PASSWORD:-1234}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data:/data
      - ./sql:/sql
    command:
      - --local-infile=1
      - --max-allowed-packet=256M

volumes:
  mysql_data:
